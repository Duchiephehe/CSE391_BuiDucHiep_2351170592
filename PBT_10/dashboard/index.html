<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-API Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <header>
            <h1><i class="fa-solid fa-chart-line"></i> Dashboard</h1>
            <div class="header-controls">
                <span id="loadTime"></span>
                <button id="refreshBtn"><i class="fa-solid fa-rotate-right"></i> Refresh All</button>
            </div>
        </header>

        <div id="globalLoading" class="global-loading hidden">
            <div class="spinner"></div>
            <p>Đang tải dữ liệu từ 3 APIs...</p>
        </div>

        <main class="grid-container" id="dashboardGrid">
            <div class="widget" id="widget-0">
                <h2><i class="fa-solid fa-users"></i> Users Data</h2>
                <div class="widget-content"></div>
                <div class="widget-error hidden"></div>
            </div>

            <div class="widget" id="widget-1">
                <h2><i class="fa-solid fa-cloud-sun"></i> Weather Hanoi</h2>
                <div class="widget-content"></div>
                <div class="widget-error hidden"></div>
            </div>

            <div class="widget" id="widget-2">
                <h2><i class="fa-solid fa-dog"></i> Random Dog</h2>
                <div class="widget-content"></div>
                <div class="widget-error hidden"></div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
